# 공개 mirror 경계 정책
# 이 파일의 선언은 접근 제어가 아닙니다. hupository/ 안의 모든 파일은 실제로 공개됩니다.

public_root: "hupository/"
default_visibility: public

physical_boundary:
  rule: "public_root 아래에는 즉시 공개해도 되는 축약본만 둔다."
  enforcement: "scripts/check-public-boundary.sh"
  private_companion_root: "private/"
  note: "network/private/secret 데이터는 visibility 표기만 하지 말고 public_root 밖으로 물리적으로 분리한다."

never_publish:
  - "개인 이메일·전화번호와 정확한 생일"
  - "건강·치료·극단적 위기 상세"
  - "신념과 관계의 비공개 상세"
  - "타인의 실명과 직접 식별자"
  - "credential, token, private key"

public_projection_rules:
  - "개인의 전환은 공개 목적에 필요한 수준으로만 요약한다."
  - "타인은 역할명 또는 익명 ID로 표현한다."
  - "private 원문을 공개본으로 옮길 때는 새 문서로 축약하고 자동 복사하지 않는다."
  - "미러 실행 전에 public boundary check가 통과해야 한다."

publishing_note: >
  공개용 프로필은 성장 서사와 현재 방향에 집중한다.
  민감한 근거와 상세 원문은 private companion에서만 보존한다.
