# 목표 트리 — data/06_goals/tree.yaml
# 장기 목표와 하위 목표의 계층 구조를 정의합니다.
# lifetime.yaml : 더 상위 사명과 시간축
# ../09_history/goals/legacy-goals.yaml : read-only legacy archive
# tree.yaml : 목표 구조와 연결 관계 (what / why this)
# progress.yaml : tree.yaml 기준 각 목표의 현재 진척과 근거 (how far)

as_of: "2026-07-29"

current_execution_window:
  period: "2026-07-11 - 2026-08-20"
  primary_goal_id: "G-AI-04"
  milestone: "2026-08-20 SW마에스트로 중간발표"
  operating_rule: "중간발표까지 다른 목표는 유지 모드로 두고 제품 데모·고객 근거·발표 서사에 집중한다."

# ─────────────────────────────────────────
# 상위 연결 (lifetime.yaml)
# ─────────────────────────────────────────
# 이 트리는 lifetime.yaml 의 "30대 (2025-2028)" 아래에 위치합니다.
# 평생 사명 → 30대 사명 → 이 트리의 G-LIFE → 중간/단기 목표
parent_lifetime: "lifetime.yaml#30대"

# ─────────────────────────────────────────
# 목표 트리
# ─────────────────────────────────────────
# 읽는 법:
#   long_term  →  현재 집중하고 있는 장기 비전
#   mid_term   →  1-3년 내 도달할 중간 목표
#   short_term →  지금 당장 실행 중인 하위 목표
# ─────────────────────────────────────────

goals:

  - id: "G-LIFE"
    type: long_term
    title: "Hupository — 삶의 객관 기록과 지식 상속을 위한 생애 데이터 구조 만들기"
    horizon: "5년+"
    status: active
    notes: >
      최상위 사명은 박세종의 삶을 객관적으로 기록하여 후대와 인공지능이 읽을 수 있는 생애 데이터로 남기는 것이다.
      이 기록을 기반으로 인류가 쌓아 올린 지식, 특히 인생을 아름답게 살아가는 방법을
      다음 세대와 사람들에게 차별 없이 상속하는 구조를 만든다.
      기존의 라이프디자인, 교육×기술, 커뮤니티, 휴포짓 창업은 이 사명을 현실에서 구현하는 하위 경로다.
    children:

      - id: "G-LIFE-RECORD"
        type: mid_term
        title: "박세종 생애 기록 데이터 저장소 고도화"
        horizon: "평생"
        status: active
        parent: "G-LIFE"
        notes: >
          daily, weekly, now, goals, decisions, wiki, project, people layer를 통해
          삶의 사실, 판단, 감정, 관계, 프로젝트, 배움을 구조화한다.
          이 목표는 Hupository 전체 구조의 최상위 저장 이유다.
        children:
          - id: "G-LIFE-RECORD-01"
            type: short_term
            title: "Hupository 구조를 평생 사명 기준으로 재정렬"
            horizon: "2026-05 - 2026-07"
            status: done
            parent: "G-LIFE-RECORD"

      - id: "G-KNOWLEDGE-INHERIT"
        type: mid_term
        title: "인류 지식의 차별 없는 상속 구조 만들기"
        horizon: "5년+"
        status: active
        parent: "G-LIFE"
        notes: >
          인류가 수천 년 동안 쌓아 올린 지식 중 무엇이 가치 있는지 탐구하고,
          다음 세대와 사람들에게 차별 없이 전달할 수 있는 교육×기술 구조를 만든다.
          현재 가장 큰 지식 후보는 인생을 아름답게 살아가는 방법이다.
        children:
          - id: "G-KNOWLEDGE-01"
            type: short_term
            title: "인생을 아름답게 살아가는 방법을 휴포짓/세종클래스/콘텐츠로 구조화"
            horizon: "2026-2027"
            status: in_progress
            parent: "G-KNOWLEDGE-INHERIT"

      - id: "G-EDU-TECH"
        type: mid_term
        title: "교육+기술 통합 서비스 구축 (세종클래스)"
        horizon: "1-3년"
        status: active
        parent: "G-LIFE"
        children:

          - id: "G-SEJONG-01"
            type: short_term
            title: "첫 유료 수강생 확보"
            horizon: "3개월"
            status: in_progress
            parent: "G-EDU-TECH"

          - id: "G-SEJONG-02"
            type: short_term
            title: "월 수익 100만원 달성"
            horizon: "6개월"
            status: not_started
            parent: "G-EDU-TECH"

          - id: "G-SEJONG-03"
            type: short_term
            title: "콘텐츠 채널 확장 (클래스101 등)"
            horizon: "6개월"
            status: in_progress
            parent: "G-EDU-TECH"
            notes: "외부 교육 플랫폼과 콘텐츠 채널까지 확장해 유입 경로를 넓힌다."

      - id: "G-AI-BUILDER"
        type: mid_term
        title: "AI 빌더 역량 확보 — 기획부터 배포까지 혼자 만드는 AI 서비스"
        horizon: "1-2년"
        status: active
        parent: "G-LIFE"
        children:

          - id: "G-AI-01"
            type: short_term
            title: "AI Agent 개발 역량 확보 (LangGraph · FastAPI)"
            horizon: "6개월"
            status: in_progress
            parent: "G-AI-BUILDER"

          - id: "G-AI-02"
            type: short_term
            title: "Hupository AI Agent 완성 (일상 수집 → 자동 업데이트)"
            horizon: "1년"
            status: in_progress
            parent: "G-AI-BUILDER"
            notes: "저널링, 현재 상태 동기화, 추출 자동화를 하나의 AI 코칭 시스템으로 연결한다."

          - id: "G-PM-01"
            type: short_term
            title: "PersonaMirror 공개 유즈케이스 정리 (3/25 목표)"
            horizon: "1주"
            status: in_progress
            parent: "G-AI-BUILDER"
            notes: >
              PersonaMirror의 첫 공개 유즈케이스.
              단기적으로는 ASM 17 Community / Creator PR 맥락에서 팀빌딩 자기소개와 실행력 증명을 동시에 보여주는 front door를 정리한다.
              장기적으로는 라이프디자인 서비스의 공개 진입점으로 확장한다.
              세부 구현 상태와 근거는 progress.yaml 및 프로젝트 문서에서 관리한다.

          - id: "G-AI-03"
            type: short_term
            title: "SW마에스트로 17기 합격"
            horizon: "1개월"
            status: done
            parent: "G-AI-BUILDER"
            notes: >
              2026-03-30 예비 3번에서 추가합격 문자 수신으로 최종 합격이 확정됐다.
              합격 이후의 실제 네트워크·팀·제품 역량 확보는 G-AI-04로 이어서 관리한다.

          - id: "G-AI-04"
            type: short_term
            title: "SW마에스트로 Team 310 — 휴포짓 제품·고객 검증과 중간발표"
            horizon: "2026-04 - 2026-11"
            status: in_progress
            parent: "G-AI-BUILDER"
            notes: >
              SW마에스트로 합격 이후의 실제 실행 목표다.
              Team 310의 팀/멘토 재구성, 고객조사/파일럿,
              5월 기획심의, 8월 중간발표, 11월 최종점검까지를 통해
              AI 빌더 역량과 투자 가능한 팀/제품 상태를 함께 만든다.
              2026-05-13 기준 Team 310은 2인팀으로 고정됐고,
              실행 축은 입시 vertical 고정보다 휴포짓의 본질인
              개인 맥락 구조화, 더 나은 AI 답변/다음 행동, 유사 맥락 연결 가능성을
              기획심의 evidence로 증명하는 방향으로 보정됐다.
              2026-05-14 기준 장기 구조는 Huposit -> Hupository -> Networking 으로 정리하고,
              2026년 첫 검증과 매출은 Huposit 축의 맥락 정리와 반복 업무 해결에서 만든다.
              2026-07-29 현재는 8월 20일 중간발표를 위해 기존 PPTX의 입력·구조화·저장·검색·추천 이유를
              하나의 동작하는 수직 흐름으로 만들고, 실제 자료 제공과 베타 사용 근거를 발표 서사에 연결하는 데 집중한다.
              MIRI/Jjinro는 이후 적용 vertical 후보로 보관한다.

      - id: "G-LIFEDESIGN-SVC"
