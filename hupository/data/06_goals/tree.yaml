        horizon: "2-3년"
        status: active
        parent: "G-LIFE"
        independence: "소마 합격/불합격과 무관하게 진행. 소마는 가속 옵션 중 하나."
        notes: >
          Hupository: Git + YAML + AI로 삶을 기록하고 성장 맥락을 구조화하는 시스템. 강의 소재이자 서비스 원형.
          PersonaMirror: 개인 페르소나 도구. Hupository 데이터로 최종 비전 데모.
          이 둘이 합쳐지면 G-LIFE의 삶의 기록, 지식 상속, 라이프디자인 사명을 실제 구현하는 경로가 된다.
          강의 방향: 기술(Git·YAML·AI Agent)로 삶을 기록하고 성장 구조를 설계하는 법.
        children:
          - id: "G-LS-01"
            type: short_term
            title: "Hupository 강의 시리즈 기획 (강의 소재화)"
            horizon: "3개월"
            status: in_progress
            parent: "G-LIFEDESIGN-SVC"
          - id: "G-LS-02"
            type: short_term
            title: "PersonaMirror 독립 서비스 배포 및 운영"
            horizon: "6개월"
            status: in_progress
            parent: "G-LIFEDESIGN-SVC"
            notes: "G-PM-01 MVP 완료 후 이어지는 단계"

      - id: "G-ORG-300"
        type: long_term
        title: "2027년부터 10년 안에 300명이 일하는 휴포짓 일자리 생태계 만들기"
        horizon: "2027-2037"
        status: active
        parent: "G-LIFE"
        notes: >
          휴포짓을 단순 소프트웨어 제품이 아니라,
          개인의 목표·고민·일·학습 맥락을 AI가 읽을 수 있는 구조로 바꾸고
          다음 행동을 돕는 사람들의 일자리 생태계로 확장한다.
          300명은 전원 본사 정규직만을 뜻하지 않고, 제품·AI·데이터·보안·고객성공·교육운영·맥락 코치·파트너 컨설턴트가 함께 만드는
          고용과 협업 구조로 해석한다.
        children:
          - id: "G-ORG-300-SOMA"
            type: short_term
            title: "SW마에스트로 1년을 300명 일자리 목표의 첫 검증 루프로 설계"
            horizon: "2026-05 - 2026-12"
            status: in_progress
            parent: "G-ORG-300"
            notes: >
              2026년 소마 기간에는 300명 조직을 직접 만들려고 하지 않는다.
              대신 휴포짓의 핵심 루프, 반복 고객군, 유료화 가능성, 사람+AI 운영 playbook,
              첫 역할 정의를 검증해 2027년부터 시작할 10년 조직 성장의 출발선을 만든다.

