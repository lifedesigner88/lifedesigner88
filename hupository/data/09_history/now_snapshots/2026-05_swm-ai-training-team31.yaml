lasting_lessons:
  - "LLM은 일정 후보를 지어내지 않고, deterministic scheduling engine 결과를 설명하는 보조자로 둔다."
  - "개인정보 보호는 원본 캘린더 복제가 아니라 availability block만 사용하는 데이터 설계에서 시작한다."
  - "짧은 해커톤형 프로젝트에서는 모든 구현물을 병합하기보다 기준 구현 하나를 선택하고 필요한 아이디어만 흡수한다."
  - "이 경험은 휴포짓의 출처 표시, 사람 승인, AI fallback, privacy-safe payload 설계에 재사용할 수 있다."

