    if_solo_or_small_team: "모두의 고민/목표 신청 폼, 고객 인터뷰, 구조화 리포트, 반복 고민군/목표군 후보, 휴포짓 데이터 루프 설명처럼 창업자 단독과 제한적 보조로도 만들 수 있는 증거에 집중한다"
    if_rebuild: "멘토와 사무국에 상황을 공유하고, 새 후보는 데이터 구조화/문제 모델링/평가 지표 축으로 제한 온보딩하며, AI/frontend/PM/backend 공백은 별도 보완한다"
    if_pause_or_pivot: "소마 일정과 개인 회복을 우선해 기획심의 목표를 재협상하고, 모두의 고민/목표 고객발굴 범위를 더 보수적으로 낮춘다"

  - trigger: "담당멘토 3인 지원 구조를 5월 기획심의와 5/18 피칭 연습에 어떻게 활용할 것인가"
    if_yes: "담당멘토 3인의 역할을 제품/BM/보안, 서비스화/실행 리듬, AI/데이터 제품화로 나누고, 각 멘토에게 서로 다른 질문을 가져간다"
    if_no: "멘토 조언을 모두 제품 범위에 넣지 않고 기획심의 메시지와 실행 범위를 더 줄여 창업자 리드로 방어 가능한 증거에 집중한다"

  - trigger: "모두의 고민/목표 고객발굴 전략이 5월 기획심의에서 너무 넓게 보이지 않도록 어떤 최소 증거를 만들 것인가"
    if_minimum_evidence_ready: "신청 폼, 10명 인터뷰 목표, 구조화 리포트 샘플 3건, 반복 고민군/목표군 후보 표, 태그/평가 지표 v0를 중심으로 발표한다"
    if_too_broad: "고객군 후보를 소마 연수생, 전환기 개발자, 예비 창업자, AI 자기이해 입문자 중 1~2개로 줄여 인터뷰한다"
    if_unclear: "담당멘토 3인에게 5/18 전까지 어떤 증거가 심사에 더 안전하고 설득력 있는지 확인한다"

  - trigger: "2026-04-25 첫 pilot candidate의 참여 의사를 중간고사 이후 실제 first output / 상담 흐름으로 전환할 수 있는가"
    if_yes: "첫 고객 파일럿을 바탕으로 부모와 학생이 원하는 질문, 리포트, 상담 연결의 실제 가치를 검증하고 5월 기획심의 스토리의 근거로 사용할 수 있음"
    if_no: "관계 기반 호감과 실제 고객 문제를 구분해 고객조사 질문, 무료 파일럿 범위, 첫 output 가설을 다시 다듬어야 함"

  - trigger: "하차한 팀원들과 감정적으로 안전한 마무리와 최소 인수인계를 할 수 있는가"
    if_yes: "감사와 존중을 유지하면서 repo, 계정, 문서, 진행 중 작업, 외부 커뮤니케이션 공백을 최소화한다"
    if_no: "설득이나 원인 논쟁보다 프로젝트 자산 보존, 접근 권한 정리, 멘토/운영진 공유를 우선한다"

  - trigger: "2026-11 말까지 3억 규모 seed 투자 가능 수준의 팀/제품 진척 도달"
    if_yes: "SW마에스트로 이후 첫 투자 라운드와 제품/팀 확장 준비"
    if_no: "제품 wedge, 사용자 검증, 팀 설명, 투자 서사 중 어디가 약한지 다시 진단"

  - trigger: "2026-05-15 13:30~15:30 AI 기술교육 31조 최종 발표"
    if_ready: "최종 발표 산출물과 발표 리허설을 마치고 Team 310 기획심의 준비와 충돌 없이 마무리"
    if_not_ready: "발표 주제, 데모 범위, 역할 분담을 빠르게 고정해야 함"

  - trigger: "2026-05-14 AI 기술교육 31조 최종 제출"
    if_ready: "데모 코드, 실행 방법, 최종 산출물을 제출하고 5/15 13:30~15:30 발표 리허설로 전환"
    if_not_ready: "제출물 범위를 줄이고 README, 실행 명령, 발표용 데모 스크립트를 먼저 고정해야 함"

  - trigger: "2026-05-10 23:59 AI 기술교육 31조 데모 코드 제출"
    if_ready: "로컬 실행 가능한 Agentic Workflow 데모 코드와 실행 방법을 제출하고 최종 발표 리허설로 전환"
    if_not_ready: "기능 범위를 줄이고 최소 실행 플로우, README, 데모 스크립트를 우선 고정해야 함"

  - trigger: "2026-05-08 AI 기술교육 31조 최종 제출본 후보 제작"
    if_ready: "통합 베이스와 흡수할 개인 레포 아이디어를 이슈 단위로 정리하고, 5/10 데모 코드 제출 전 실행 가능한 후보를 만든다"
    if_not_ready: "통합 범위를 더 줄이고 README, 샘플 데이터, 최소 실행 플로우를 먼저 고정해야 함"

  - trigger: "Soma:ON 첫 영상 공개와 1년 운영 계획/예산안 제출"
    if_ready: "첫 촬영본 편집과 공개 범위를 정리하고, 소마 공식 아카이브·교류 플랫폼으로서 월별 콘텐츠 리듬과 실비 지원 구조를 사무국에 제안"
    if_not_ready: "첫 영상 편집 범위, 공개 정보 수준, 장비/운영비 산정 기준을 먼저 좁혀야 함"

  - trigger: "2026-09-19 14:00~18:00 은평청년축제 기획"
    if_clear_role: "축제 기획단원으로 구체 역할을 맡아 지역 커뮤니티 기획 경험을 축적"
    if_unclear_role: "소마 핵심 일정과 충돌하지 않는 범위에서 회의 참여와 아이디어 제안 중심으로 유지"

  - trigger: "서울시 시민참여예산위원 결과"
    if_accepted: "지역 커뮤니티 활동 확장 — 소마와 병행 가능한 수준 유지"
    if_rejected: "은평청년네트워크 집중 유지"
