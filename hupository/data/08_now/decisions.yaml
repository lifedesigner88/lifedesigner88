# 현재 유효한 의사결정 — data/08_now/decisions.yaml
# AI가 현시점 맥락을 빠르게 파악하고 다음 행동을 논의할 때 읽는 live decision 레이어.
# 결과가 끝났거나 다른 결정에 의해 대체된 항목은 ../09_history/decisions/ 로 이동한다.

as_of: "2026-05-10"
archive_ref:
  decisions: "../09_history/decisions/2026-04.yaml"
selection_rule:
  keep_here: "오늘/이번 달 판단을 직접 바꾸는 live decision만 남긴다."
  move_to_history: "결과가 종료됐거나, 현재 전략을 더는 직접 바꾸지 않는 결정은 09_history로 옮긴다."

decisions:

  - id: "D009"
    date: "2026-03-27"
    decision: "장기 사명의 핵심 문제의식을 `삶과 성장을 설계할 구조의 부족`으로 명료화"
    rationale: >
      최근 대화와 정본 데이터 재독을 통해 반복되는 패턴이
      단순한 정보 전달이나 자기계발이 아니라,
      방향을 잃은 사람·늦게 출발한 사람·흩어진 가능성을 가진 사람들이
      삶과 성장을 설계할 구조를 갖지 못해 흔들리는 문제를 푸는 데 있다는 점이 확인됐다.
      앞으로의 프로젝트와 선택은 이 문제의식에 얼마나 직접 연결되는지를 기준으로 본다.
    alternatives_rejected:
      - option: "교육, 개발, 커뮤니티, 코칭을 각각 별개의 관심사로 해석"
        why_rejected: "실제 데이터에서는 모두 동일한 문제의식의 다른 표현으로 반복됨"
    outcome: "success"
    outcome_note: "2026-03-27 대화에서 사용자 본인이 이 해석에 강하게 공감했고, identity/lifetime/tree 문구에 함께 반영했다."

  - id: "D011"
    date: "2026-03-27"
    decision: "내 사업에서는 제안/섭외 단계부터 기본 응답성과 맥락 존중을 지키는 운영 원칙을 둔다"
    rationale: >
      클래스101 접점에서 정성 있는 의견과 피드백을 요청한 뒤에도
      후속 응답과 맥락 설명이 충분히 돌아오지 않는 경험을 하면서,
      내가 직접 사업을 한다면 사람을 파이프라인의 한 건처럼 다루지 않겠다는 기준이 선명해졌다.
      앞으로는 초기 접점일수록 `왜 연락했는지`, `지금 어떤 단계인지`, `다음은 무엇인지`를 분명히 전하는 태도를 지향한다.
    alternatives_rejected:
      - option: "효율을 위해 초기 접점에서는 응답성과 맥락 설명을 최소화"
        why_rejected: "단기 처리량은 높아질 수 있어도 신뢰와 브랜드를 장기적으로 갉아먹을 가능성이 큼"
      - option: "좋은 의도가 있으면 소통 부족은 감수"
        why_rejected: "의도와 별개로 상대는 실제 응답성과 존중의 수준을 경험하게 됨"
    outcome: "success"
    outcome_note: "내가 만들 사업의 운영 태도를 정하는 기준으로 계속 유지한다."

  - id: "D012"
    date: "2026-03-27"
    decision: "앞으로 팀을 이끌 때는 팀원의 정성과 맥락을 존중하는 운영 태도를 핵심 기준으로 둔다"
    rationale: >
      클래스101 접점에서 존중과 응답성이 부족하다고 느낀 경험을 돌아보며,
      소마 팀을 포함한 앞으로의 협업에서는 이렇게 하지 않겠다는 기준이 분명해졌다.
      팀 운영에서는 실력과 역할 배치도 중요하지만,
      먼저 기대를 주거나 의견을 요청한 뒤에는 짧더라도 응답하고,
      다음 단계와 판단 기준을 숨기지 않는 태도가 신뢰를 만든다고 본다.
    alternatives_rejected:
      - option: "팀 운영에서는 효율을 위해 감정과 맥락보다 역할 수행만 본다"
        why_rejected: "단기 조율은 편할 수 있어도 장기적으로 신뢰와 협업 밀도를 약하게 만들 가능성이 큼"
      - option: "좋은 팀은 실력만 충분하면 존중 방식은 크게 중요하지 않다"
        why_rejected: "실제 경험상 존중과 응답성은 같이 일하고 싶은 마음과 몰입도에 직접 영향을 줌"
    outcome: "success"
    outcome_note: "소마 팀 운영과 앞으로의 협업 기준으로 계속 유지한다."

  - id: "D021"
    date: "2026-04-10"
    decision: "클래스101 경로는 당분간 진행하지 않고, SW마에스트로 팀 프로젝트와 5월 기획심의 수습에 집중한다"
    rationale: >
      현재 시점의 가장 큰 레버리지는 클래스101 강의 제작보다
      SW마에스트로 팀 프로젝트의 방향 고정, 멘토링, 첫 MVP 구체화에 있다.
      클래스101은 이미 후속 응답성과 신뢰도 측면에서 약한 신호가 있었고,
      지금 병행하면 집중 용량이 분산될 가능성이 크다.
      따라서 당분간은 클래스101 제작을 멈추고,
      소마 본과정과 팀 제품을 밀어 올리는 데 집중하는 편이 현재 우선순위와 더 맞다.
      2026-05-09 이후에는 이 판단의 초점이 팀원 2명 및 담당멘토 1명 하차 수습과
      5월 기획심의 범위 재산정으로 보정됐다.
    alternatives_rejected:
      - option: "클래스101 제작을 4~5월에 병행한다"
        why_rejected: "지금은 소마 팀 프로젝트와 멘토 매칭이 더 직접적인 레버리지이며, 병행 시 집중력이 분산될 수 있다"
      - option: "클래스101을 여전히 조건부 채널 후보로 적극 열어둔다"
        why_rejected: "현재는 재검토보다 명시적 비집중이 더 선명한 운영 판단이다"
    outcome: "success"
    outcome_note: "2026-04-10 기준 클래스101은 진행하지 않고, 당분간 SW마에스트로 팀 프로젝트와 멘토링에 집중한다."

  - id: "D022"
    date: "2026-04-10"
    decision: "당분간 세종클래스 첫 매출 압박보다, 2026-11 말 SW마에스트로 수료 시점에 3억 규모 seed 투자를 받을 수 있는 팀/제품 진척을 더 중요한 제약으로 둔다"
    rationale: >
      현재 시점에는 세종클래스 첫 매출보다
      SW마에스트로 팀 프로젝트를 투자 가능한 수준의 문제 정의, 팀, 멘토 네트워크, MVP 진척으로 밀어 올리는 쪽이
      더 큰 레버리지로 판단된다.
      수료 시점인 2026-11 말은 외부 설명과 팀 스토리, 제품 진척을 한 번에 증명해야 하는 분기점이므로,
      지금부터의 우선순위도 그 기준에 맞춰야 한다.
      따라서 세종클래스 수익 압박은 당분간 1순위 제약에서 잠시 내려두고,
      멘토링 활용, MVP 계약 고정, 투자 가능한 제품/실행 설명을 더 앞에 둔다.
    alternatives_rejected:
      - option: "세종클래스 첫 매출 압박을 계속 최상위 제약으로 둔다"
        why_rejected: "현재는 SW마에스트로 팀 프로젝트가 더 큰 중장기 레버리지이며, 제약 우선순위도 그쪽에 맞추는 편이 낫다"
      - option: "수익과 seed 투자를 같은 비중으로 병행 관리한다"
        why_rejected: "동시 집중 용량이 2인 상황에서 현재는 seed 투자 가능성을 만드는 경로에 더 명확히 무게를 둘 필요가 있다"
    outcome: "pending"
    outcome_note: "2026-04-10 기준 현재 제약의 중심은 `세종클래스 첫 매출`보다 `11월 말 seed 투자 가능 수준 도달`이다."

  - id: "D024"
    date: "2026-04-13"
    decision: "2인 체제 전환 이후 팀 상황을 투명하게 공개하고, 2026-05-10까지 애자일 팀빌딩으로 새 팀원 또는 팀 재구성을 병행 탐색한다"
    rationale: >
      2026-04-12 팀원 이탈 이후 남은 두 사람은
      `교육 기술을 통한 자기이해 지원`과
      `오프라인 대화 데이터 기반 AI 분석 리포트`라는 문제의식에 계속 공감하고 있다.
      반면 이탈한 팀원이 선호한 방향은 수익 모델이 더 직접적인 별도 IP 비즈니스였고,
      이 차이는 개인 감정보다 비즈니스 fit 차이에 가까웠다.
      따라서 지금 필요한 것은 빈자리를 서둘러 채우는 것보다,
      현재 팀이 무엇을 믿고 어떤 방식으로 검증하려 하는지 투명하게 공개한 뒤
      그 문화와 문제의식에 실제로 공감하는 사람을 찾는 것이다.
      공개 모집과 함께 2026-04-14부터는 이미 팀이 있는 연수생에게도
      노션 소개 페이지를 바탕으로 직접 제안하고,
      1주일 trial처럼 빠르게 함께 일해보며 fit을 확인하는 편이 현재 상황에 더 맞다.
    alternatives_rejected:
      - option: "팀 분리 사실을 최소한으로만 알리고 조용히 새 팀원을 찾는다"
        why_rejected: "현재 상황과 기준을 숨기면 같은 불일치를 다시 반복할 가능성이 커진다"
      - option: "역할만 맞으면 우선 합류시키고 이후에 문화와 방향을 맞춘다"
        why_rejected: "지금은 구현 스킬보다 문제의식, 수익화 해석, 팀 운영 방식의 fit이 더 중요하다"
      - option: "당분간 완전 2인 체제로만 가고 팀 재구성 탐색은 미룬다"
        why_rejected: "product / frontend / PM / outreach 공백이 실제로 존재하므로 병행 탐색이 더 현실적이다"
    outcome: "pending"
    outcome_note: >
      현재 기준 운영 방식은
      300명 규모 연수생/멘토/엑스퍼트/사무국 앞에 상황과 문화를 투명하게 공유하고,
      2026-04-14부터 직접 제안을 병행하며,
      2026-05-10까지 애자일하게 fit을 검증하는 것이다.
      다만 2026-04-15 기준 초기 직접 제안은 모두 거절되어,
      다음 모집은 막연한 충원보다 제품 방향과 필요한 역할을 더 선명하게 고정한 뒤 다시 여는 쪽으로 보정됐다.

  - id: "D025"
    date: "2026-04-14"
    decision: "service/BM/completion fit이 강한 멘토 후보 1명을 현재 팀의 담당멘토 1순위로 확정하고, 문제정의·서비스기획·BM·완주 역량을 보강하는 축으로 삼는다"
    rationale: >
      2026-04-14 멘토링에서 해당 멘토 후보는
      `누가 왜 불편한가`, `왜 이 기술이어야 하는가`, `빠른 MVP 배포와 검증`,
      `프로젝트를 끝까지 이끄는 팀`이라는 프레임을 분명히 제시했다.
      이는 현재 2인 체제로 재정렬 중인 팀이 가장 부족하게 느끼는
      product / service planning / BM / completion 관점과 직접 맞닿아 있다.
      사내 지식관리 서비스 경험의 다른 멘토도 훌륭한 접점이었지만,
      창업집중형 팀이 지금 당장 원하는 도움의 성격은 이 멘토 후보 쪽이 더 직접적이라고 봤다.
    alternatives_rejected:
      - option: "좋은 인상과 네트워크 폭을 이유로 사내 지식관리 배경 멘토를 우선한다"
        why_rejected: "대화의 질은 높았지만, 현재 팀의 창업집중형 문제정의·BM·완주 관점을 가장 직접적으로 보강해주지는 않았다"
      - option: "멘토 선택을 더 미루고 계속 넓게만 탐색한다"
        why_rejected: "4월 안에 3인 조합을 좁혀야 하는 압박이 있으므로, 강한 fit이 보인 후보는 먼저 잠그는 편이 낫다"
    outcome: "success"
    outcome_note: >
      2026-04-14 미팅 뒤 내부 기준으로는 담당멘토 1순위로 확정했다.
      2026-04-24에는 해당 축의 담당멘토와 19:00~22:00 실제 멘토링을 진행했고,
      신규 팀원 소개, 6자 대면 인터뷰 설계 조언, 밸류 프로포지션 디자인 실습까지 이어졌다.
      따라서 담당멘토 1명 확보와 service/BM/completion 보강 축은 현재 기준 성공으로 본다.
      이후 담당멘토 3인 조합까지 닫았으나, 2026-05-09 팀원 2명 하차 공유 뒤
      담당멘토 1명이 하차하면서 일시적으로 2인 유지 기준으로 재편됐다.
      2026-05-10 신규 담당멘토 1명이 합류해 현재 멘토 지원 구조는 다시 3인 체계로 복구됐다.

  - id: "D026"
    date: "2026-04-15"
    decision: "초기 직접 제안이 모두 거절된 뒤에는, 5/10까지의 팀빌딩을 급하게 밀기보다 MVP 방향과 필요한 팀 역할을 먼저 명확히 한 뒤 역할기반 모집으로 전환한다"
    rationale: >
      현재까지 사용자가 직접 제안했던 후보들이 모두 거절하면서,
      `좋은 사람을 먼저 모아보자`는 방식만으로는 실제 합류를 만들기 어렵다는 신호가 확인됐다.
      지금 공백은 단순 개발자 1명이 아니라 product / frontend / PM / mentor outreach 축에 더 가깝고,
      이 역할을 어떤 제품 방향과 왜 연결하는지 선명하지 않으면 모집 설득력이 약해질 수 있다.
      또한 2026-05-10까지는 아직 시간이 남아 있으므로,
      조급하게 아무나 채우기보다 2인 기준 MVP 계약과 필요한 자리의 정의를 먼저 고정하는 편이 더 낫다.
    alternatives_rejected:
      - option: "현재 설명 수준 그대로 직접 제안을 더 많이 보내본다"
        why_rejected: "현재도 이미 거절이 반복됐고, 역할과 방향이 흐린 상태에서는 설득력이 더 떨어질 수 있다"
      - option: "팀빌딩 탐색을 당분간 완전히 멈추고 2인 체제로만 간다"
        why_rejected: "공백 역할이 실제로 존재하므로 탐색은 유지하되, 기준을 더 정교하게 바꾸는 편이 현실적이다"
    outcome: "pending"
    outcome_note: >
      2026-04-15 기준 다음 팀빌딩의 전제는
      `우리가 지금 정확히 어떤 제품을 왜 만들고 있고, 어떤 자리를 왜 채우려 하는가`를 한 장으로 설명할 수 있게 되는 것이다.

  - id: "D027"
    date: "2026-04-18"
    decision: "Hupository/Team 310의 1차 기획 확정본은 `초·중 생활기록부 기반 예비 고1 AI 대입컨설팅 서비스`로 둔다"
    rationale: >
      오늘 대화와 정리 과정에서,
      기존 relation reporting이나 부모 선행형 Retro-Hupository 구조보다
      사용자의 교육 도메인 신뢰 자산과 실제 고객 문제를 더 직접적으로 연결하는 제품이 필요하다는 판단이 선명해졌다.
      예비 고1 학부모는 이미 초등 6년과 중학교 누적 기록을 가지고 있지만,
      이를 입시 방향과 고교 진학 준비라는 관점에서 읽어주는 구조가 부족하다.
      따라서 첫 제품은 `초·중 누적 데이터를 읽고, 부족한 정보를 AI 질문으로 보강한 뒤,
      무료 초기 리포트와 전문 컨설턴트 연결까지 이어지는 AI 대입컨설팅 서비스`로 좁히는 편이 맞다.
    alternatives_rejected:
      - option: "RRS 기반 오프라인 관계 리포팅 플랫폼을 그대로 유지"
        why_rejected: "현재 팀/창업자 신뢰 자산과 즉시 검증 가능한 고객 문제 사이의 거리가 더 컸다"
      - option: "부모 자기기록 복기를 앞단에 두는 Retro-Hupository 구조를 첫 제품으로 밀기"
        why_rejected: "흥미로운 진입 아이디어였지만, 1차 MVP의 문제정의와 수익 구조를 더 넓히는 효과가 있었다"
      - option: "초6~중2 전체를 포괄하는 넓은 성장 데이터 플랫폼 설명을 유지"
        why_rejected: "첫 wedge로는 고객과 가치 약속이 아직 넓었고, 예비 고1 전환기가 더 선명했다"
    outcome: "pending"
    outcome_note: >
      2026-04-18 기준 현재 live decision이다.
      2026-04-26에는 이 방향을 데이터 기반 고교 진학 및 자생적 진로 성장 내비게이션으로 정리했다.
      2026-05-08 기준 이름 경계는 다시 정리되어, 입시·학생부 vertical은 `미리(MIRI)`로 두고
      `찐로(Jjinro)`는 취업·커리어 vertical 후보로 분리한다.
      사업기획서상 핵심 흐름은 생기부 분석, AI 인터뷰, 10단계 진로 플로우,
      1회 무료 상담, 8개월 마스터플랜, 월 구독형 SaaS 전환이다.
      다음 단계는 이 1차 기획 확정본을 엑스퍼트/멘토 피드백, MVP 계약, 초기 파일럿 설계 수준으로 더 구체화하는 것이다.

  - id: "D028"
    date: "2026-04-18"
    decision: "초기 채널은 대형 교육기업 직접 제휴보다 `과목 선생님 추천/연결` 같은 가벼운 네트워크 경로를 우선한다"
    rationale: >
      2026-04-18 교육업계 전 직장 네트워크와의 통화에서,
      수학·물리 같은 과목 수업 선생님을 추천해 학생을 연결하는 형태는 현실적으로 가능하다는 신호가 나왔다.
      반면 대형 교육기업 자체가 초기 스타트업 수준의 Team 310과 직접 무언가를 함께 하기에는
      의사결정과 실행 단위가 너무 크고 무겁다는 감각이 확인됐다.
      따라서 지금 단계에서는 법인 단위 제휴를 서둘러 만들기보다,
      개별 선생님 추천, 상담 연결, 소규모 네트워크 기반 파일럿처럼 더 가벼운 채널을 우선하는 편이 맞다.
    alternatives_rejected:
      - option: "대형 교육기업과의 직접 제휴를 초기 GTM 핵심축으로 둔다"
        why_rejected: "현재 팀 규모와 제품 초기 단계에 비해 파트너십 단위가 너무 크고, 속도가 크게 느려질 수 있다"
      - option: "추천/연결 없이 AI 무료 리포트만으로 초기 수익화를 본다"
        why_rejected: "현재 고객 신뢰와 실질 전환을 만들기 위해서는 사람 연결형 후속 경로가 더 유효해 보인다"
    outcome: "pending"
    outcome_note: >
      초기 실행에서는 과목 선생님 추천과 전문 컨설턴트 연결을 함께 열어두되,
      대형 교육기업 법인 제휴는 당장의 핵심 가설이 아니라 후속 가능성 정도로 본다.

  - id: "D029"
    date: "2026-04-18"
    decision: "소마 기간 동안 동화세상에듀코와의 B2B 제휴는 현재 전략에서 제외하고, 개별 선생님 추천/연결 경로만 현실적 채널로 본다"
    rationale: >
      2026-04-18 14:00 KST 전후 약 40분간의 통화를 통해,
      수학·물리 같은 과목 수업 선생님 추천 형태의 학생 연결은 가능할 수 있다는 신호가 있었다.
      반면 동화세상에듀코 같은 대형 교육기업과 Team 310 같은 초기 스타트업 팀이
      소마 기간 안에 직접 B2B 제휴를 만들고 실행하는 것은 의사결정 구조와 실행 단위상 사실상 어렵다는 판단이 더 선명해졌다.
      또한 에듀코 입장에서는 고객 유입 자체보다 `좋은 선생님을 충분히 확보하고 유지하는 것`이 더 민감한 문제이고,
      우리가 선생님 추천과 직접 소통 구조를 가지면 장기적으로 우수 선생님을 외부에 빼앗길 수 있다는 우려가 생길 수 있다.
      이 이해관계 충돌 때문에 협업 유인이 구조적으로 약하다고 본다.
      따라서 에듀코 법인 제휴는 현시점 실행 전략에서 제외하고,
      개별 선생님·개별 컨설턴트 연결 같은 가벼운 네트워크 경로만 남기는 편이 맞다.
    alternatives_rejected:
      - option: "에듀코와의 B2B 제휴 가능성을 여전히 소마 기간 핵심 채널 후보로 유지한다"
        why_rejected: "현재 속도와 팀 규모 기준으로는 기대 대비 실행 가능성이 너무 낮고, 선생님 유출 우려까지 있어 이해관계도 맞지 않는다"
      - option: "사람 연결 채널 자체를 모두 버리고 순수 AI 리포트 단독 모델로 간다"
        why_rejected: "지금 단계에서는 후속 사람 연결 경로가 고객 신뢰와 BM 실험에 여전히 중요하다"
    outcome: "pending"
    outcome_note: >
      에듀코는 향후 먼 시점의 가능성으로만 남겨두고,
      현재는 개별 선생님 추천/연결과 소규모 네트워크 기반 파일럿만 실제 채널로 본다.

  - id: "D030"
    date: "2026-04-19"
    decision: "현재 단계에서는 기능을 더 넓히기보다, 실제 고객이 원하는 첫 output과 후속 연결을 먼저 듣는 고객조사를 우선한다"
    rationale: >
      2026-04-19 여러 학부모·학생·학교 교육 네트워크와의 대화에서,
      접점마다 상황은 달랐지만 공통적으로 드러난 것은
      사용자가 미리 정한 솔루션보다 각 가정이 현재 무엇을 막막해하고 무엇을 원하고 있는지를 먼저 듣는 일이 더 중요하다는 점이었다.
      특히 부모는 추상적 AI 설명보다 `지금 우리 아이에게 어떤 다음 선택이 맞는가`,
      `누가 어떤 방식으로 도와줄 수 있는가`에 더 민감하게 반응한다.
      따라서 지금은 아이디어를 더 넓히거나 기능을 앞서 설계하기보다,
      문제 인터뷰와 고객조사를 통해 첫 output의 가치와 실제 니즈를 먼저 확인하는 편이 맞다.
    alternatives_rejected:
      - option: "현재 가설만으로 기능 정의를 더 밀어붙인다"
        why_rejected: "실제 고객이 원하는 결과물과 전환 포인트를 충분히 듣지 못하면 build가 다시 자기 확신 중심으로 흐를 수 있다"
      - option: "새로 열린 접점마다 각각 다른 서비스로 넓게 반응한다"
        why_rejected: "접점은 다양하지만, 지금 필요한 것은 범위 확장보다 공통 pain과 원하는 첫 output을 더 정확히 듣는 일이다"
    outcome: "pending"
    outcome_note: >
      2026-04-19 기준 live decision이다.
      2026-04-25 첫 대면 고객 인터뷰에서 중3 학생과 보호자가 프로젝트 설명을 듣고,
      학생이 참여 의사를 밝히면서 첫 파일럿 후보가 실제 상담 흐름으로 이어질 가능성이 생겼다.
      다음 단계는 이 긍정 신호를 관계 기반 호감과 실제 고객 문제로 구분해 보고,
      고객이 원하는 첫 결과물과 후속 연결을 중간고사 이후 상담 흐름에서 검증하는 것이다.

  - id: "D031"
    date: "2026-04-22"
    decision: "신규 팀원 합류 의사 확정 이후 팀빌딩의 초점을 추가 모집보다 3인 체제 온보딩과 역할 경계 안정화로 옮긴다"
    rationale: >
      2인 체제에서 열려 있던 팀빌딩 branch가 2026-04-22 점심, 커피 대화,
      약 2시간 인수인계, 다음날 팀 사진촬영용 옷 구매까지 이어지며
      신규 팀원의 합류 의사 확정으로 닫혔다.
      이 행동 신호는 단순 관심보다 강한 커밋으로 보이며,
      현재 판단을 움직이는 질문도 `합류할까?`에서
      `어떤 역할 경계와 실행 리듬으로 3인 체제를 안정화할까?`로 바뀐다.
      다만 frontend / PM / domain validation / consultant partnership 공백이 자동으로 사라진 것은 아니므로,
      온보딩과 역할 재배치를 4/29 MVP 리듬 안에서 현실적으로 좁혀야 한다.
    alternatives_rejected:
      - option: "계속 2인 체제를 기본값으로 두고 팀빌딩 branch를 미정 상태로 둔다"
        why_rejected: "합류 의사가 행동으로 확정되었으므로 현재 상태를 2인 체제로 계속 읽으면 실행 계획과 역할 배치가 늦게 보정된다"
      - option: "합류 확정 직후 곧바로 추가 모집을 1순위로 유지한다"
        why_rejected: "지금은 새 사람을 더 찾기보다 이미 합류하기로 한 팀원이 실제 실행 리듬에 붙도록 만드는 것이 더 직접적인 병목이다"
    outcome: "replaced"
    outcome_note: >
      2026-04-22 기준 합류 의사는 확정으로 보았고,
      2026-04-26 상세 프로필 정리 결과 3인 체제 온보딩과 역할 경계 안정화를 추진했다.
      그러나 2026-05-09 핵심 팀원 2명이 하차 의사를 밝히며 3인 체제 실행 가정은 종료됐다.
      현재 판단은 D040의 수습, 인수인계, 멘토 공유, 범위 재산정으로 대체한다.

  - id: "D032"
    date: "2026-04-25"
    decision: "첫 고객 파일럿은 무료 컨설팅으로 신뢰와 첫 output 가치를 먼저 검증하고, 이후 상담/플랫폼 이용 가설의 전환 가능성을 본다"
    rationale: >
      2026-04-25 첫 대면 고객 인터뷰에서 팀은 실제 학생과 보호자에게 프로젝트를 피칭했고,
      학생이 참여 의사를 밝히며 중간고사 이후 컨설팅을 시작할 수 있는 구체 후보가 생겼다.
      이 단계에서 바로 유료 전환을 앞세우기보다,
      무료 컨설팅 파일럿으로 신뢰와 결과물의 체감 가치를 먼저 만들고,
      이후 상담과 플랫폼 이용료 가설을 검증하는 편이 현재 관계와 제품 성숙도에 더 맞다.
      다만 첫 고객이 관계 기반 접점에서 온 만큼, 호감과 실제 지불 의사를 구분하고
      output 범위, 상담 횟수, 개인정보/생활기록부 처리 기준을 명확히 해야 한다.
    alternatives_rejected:
      - option: "첫 인터뷰의 긍정 반응만으로 곧바로 유료 상품 검증으로 해석한다"
        why_rejected: "관계 기반 호감과 실제 문제/지불 의사를 분리하지 않으면 검증 신호를 과대평가할 수 있다"
      - option: "무료 파일럿 범위를 넓게 열어 고객 만족을 최우선으로 둔다"
        why_rejected: "초기 신뢰 확보에는 도움이 되지만, 4/29 MVP와 팀 리소스를 잠식할 수 있어 output과 운영 범위가 필요하다"
      - option: "고객 반응과 무관하게 4/29 MVP 기능 구현만 우선한다"
        why_rejected: "첫 고객이 실제로 원하는 결과물과 상담 연결 흐름을 반영하지 않으면 MVP가 자기 확신 중심으로 흐를 수 있다"
    outcome: "pending"
    outcome_note: >
      중간고사 이후 시작 가능한 첫 파일럿 후보가 생겼다.
      다음 판단 과제는 첫 상담에서 제공할 output, 생활기록부/상담 데이터 동의와 보관 기준,
      무료 컨설팅 범위, 이후 유료 상담/플랫폼 전환 질문을 최소 계약으로 정리하는 것이다.

  - id: "D033"
    date: "2026-04-30"
    decision: "Soma:ON은 단발성 팀 소개 영상이 아니라, 소마의 사람·팀·프로젝트를 기록하고 연결하는 공식 아카이브이자 교류 플랫폼으로 제안한다"
    rationale: >
      2026-04-30 첫 촬영과 15:30부터 약 50분간 진행한 사무국 제안 미팅을 통해 Soma:ON이 단순 홍보 콘텐츠보다
      내부 네트워킹, 서울-부산 연결, 공식 행사 기록, 대외 브랜드 자산화까지 포괄할 수 있다는 신호가 생겼다.
      사무국도 연수생 자발적 활동으로 인정하고 1년 운영 계획과 실비 기반 예산안 제출을 요청했으므로,
      현재 판단은 `첫 영상만 잘 만든다`보다 `지속 운영 가능한 공식 유튜브 운영단으로 설계한다`에 가깝다.
    alternatives_rejected:
      - option: "첫 회차 소마퀴즈 편집과 공개만 단기 과제로 보고 운영 구조 논의를 미룬다"
        why_rejected: "사무국의 운영계획/예산안 요청이 생겼기 때문에, 첫 영상 편집과 동시에 지속 운영 구조를 잡는 편이 더 현실적이다"
      - option: "외주형 공식 홍보 채널처럼 운영한다"
        why_rejected: "Soma:ON의 핵심 가치는 연수생 내부자의 시선과 자발적 제작에서 나오므로, 외주 홍보물 문법으로 가면 차별성이 약해진다"
    outcome: "pending"
    outcome_note: >
      다음 판단 과제는 2026-05-07 첫 영상 공개를 위한 편집과,
      1년 운영 계획의 월별 콘텐츠 리듬, 예산 항목, 장비/운영비 기준,
      팀·개인 식별 정보 공개 범위를 구체화하는 것이다.

  - id: "D034"
    date: "2026-05-02"
    decision: "Team 310 기획심의 준비에서는 직관 중심 아이디어 전개보다 고객 세그먼트와 객관 자료조사를 먼저 닫은 뒤 인터뷰, MVP, 히어로 페이지로 연결한다"
    rationale: >
      2026-05-02 엑스퍼트 회의에서 고객 세그먼트를 나누고 그레이존을 밝혀둔 뒤 하나를 선택해야
      투자자와 팀원을 설득할 수 있다는 조언을 받았다.
      사용자는 지금까지 직관 중심으로 프로젝트를 밀어온 면이 있었지만,
      5월 기획심의와 MVP 실행에서는 객관 자료조사, 고객 세그먼트 정의,
      검증 질문, 첫 고객군 선택 근거가 먼저 필요하다고 판단했다.
      따라서 다음 실행은 중3·고1·고2 시기의 학생, 학부모, 선생님을 나눈 9개 세그먼트 조사에서 출발한다.
    alternatives_rejected:
      - option: "현재 철학과 직관만으로 MVP와 히어로 페이지를 먼저 만든다"
        why_rejected: "투자자와 팀원을 설득하려면 문제 세그먼트, 시장/이해관계자 그레이존, 인터뷰 근거가 먼저 필요하다"
      - option: "여러 세그먼트를 모두 열어둔 채 범용 교육 AI 서비스로 설명한다"
        why_rejected: "기획심의 전에는 첫 고객군과 검증 질문을 좁혀야 MVP 메시지와 실행 범위가 선명해진다"
    outcome: "pending"
    outcome_note: >
      다음 판단 과제는 9개 세그먼트 중 첫 인터뷰와 MVP를 걸 고객군을 선택하고,
      무료 베타 리포트/탐구 플래너의 첫 검증 질문과 히어로 페이지 메시지를 맞추는 것이다.
      2026-05-05 VC 멘토링 이후 시장조사는 경쟁업체 IR 북을 먼저 분석해
      투자자 설득 언어와 시장 근거를 뽑는 방식으로 보강한다.

  - id: "D035"
    date: "2026-05-04"
    decision: "Team 310에서는 휴포짓을 고정 솔루션으로 전제하지 않고, 이미 확보된 중3 파일럿 후보를 중심으로 고객개발형 MVP를 확장한다"
    rationale: >
      2026-05-04 팀 회의에서 한 코파운더가
      휴포짓이라는 추상적 솔루션을 먼저 정해두고 그에 맞는 고객을 찾는 흐름처럼 보인다는 불안을 제기했다.
      팀은 수익성과 고객 문제 검증을 더 선명히 하기 위해,
      창업자가 들고 온 기존 솔루션을 당분간 전제로 고정하지 않고
      이미 확보된 중3 파일럿 후보의 실제 문제와 원하는 첫 output을 기준으로 MVP를 좁히는 쪽에 합의했다.
      같은 날 만난 외부 멘토도 휴포짓 자체의 시장성은 추상 개념만으로 판단하기 어렵고,
      현재처럼 확보된 고객을 중심으로 고객개발을 확장하는 편이 낫다고 조언해 팀 합의를 보강했다.
    alternatives_rejected:
      - option: "휴포짓을 현재 MVP의 고정 솔루션으로 두고 적합한 고객을 찾는다"
        why_rejected: "솔루션 선결정처럼 보이면 코파운더의 수익성 불안이 커지고, 실제 고객 문제 검증이 흐려질 수 있다"
      - option: "기존 비전을 완전히 폐기하고 단기 수익 아이템만 찾는다"
        why_rejected: "장기 비전은 유지하되, 현재 MVP에서는 고객 문제와 첫 output 검증을 우선하는 편이 더 균형적이다"
    outcome: "pending"
    outcome_note: >
      다음 판단 과제는 중3 파일럿 후보의 실제 문제, 무료 베타 output,
      후속 상담/플랫폼 전환 가설을 기준으로 MVP 범위와 BM 질문을 다시 좁히는 것이다.

  - id: "D036"
    date: "2026-05-05"
    decision: "Team 310의 시장조사는 일반 AI 리서치보다 경쟁업체 IR 북 분석을 우선해 투자자 설득 언어와 시장 근거를 확보한다"
    rationale: >
      2026-05-05 VC 멘토링에서 휴포짓 구조와 입시시장이 VC 관점에서도 검토해볼 만한 시장이라는
      긍정 신호를 얻었다. 동시에 멘토는 인공지능을 활용한 일반 시장조사보다
      경쟁업체가 실제 투자자를 설득하기 위해 만든 IR 북을 분석하는 편이 더 효과적이라고 조언했다.
      따라서 5월 기획심의와 2026-05-18 피칭 연습 전까지는
      경쟁업체 IR 자료에서 시장 규모, 고객 문제, 가격/수익 모델, 투자자 설득 문장을 뽑아
      Team 310의 MVP와 BM 질문에 연결하는 편이 현재 단계에 더 맞다.
    alternatives_rejected:
      - option: "AI를 활용한 일반 시장조사만으로 시장성 근거를 만든다"
        why_rejected: "일반 리서치는 넓은 배경 이해에는 유용하지만, 투자자가 실제로 반응한 언어와 숫자를 얻기에는 약할 수 있다"
      - option: "첫 고객 반응만으로 시장성을 설명한다"
        why_rejected: "파일럿 신호는 중요하지만, 기획심의와 피칭에서는 시장 구조와 경쟁사 근거가 함께 필요하다"
    outcome: "pending"
    outcome_note: >
      다음 판단 과제는 경쟁업체 IR 북 후보를 모으고,
      2026-05-18 피칭 연습 전까지 Team 310이 사용할 시장성 근거와 BM 가설로 압축하는 것이다.

  - id: "D037"
    date: "2026-05-08"
    decision: "Team 310의 기술·제품 범위 판단은 합의된 범위, PR 병합 기준, 팀 지속 가능성을 우선한다"
    rationale: >
      리더의 방향 선언이 늦어지면 팀원의 불안이 과도한 일정 통제,
      외부 정보 과의존, 합의되지 않은 기능 구현으로 표면화될 수 있다.
      이때 성실하게 따라오는 팀원이 일정 압박을 흡수하면 건강과 실행 지속성이 먼저 무너질 수 있다.
      따라서 Team 310은 합의되지 않은 기능이나 shadow work를 제품 범위에 자동 편입하지 않고,
      고객 페인 연결, KPI 연결, 유지보수 담당자, 1주 내 검증 가능성,
      추가 야근 유발 여부를 확인한 뒤 PR 병합과 범위 편입을 결정한다.
    alternatives_rejected:
      - option: "밤샘 구현량이나 기능 개수 자체를 높은 기여로 인정한다"
        why_rejected: "고객 가치와 검증 계획 없이 기능이 늘어나면 5월 기획심의 메시지와 팀 리소스를 동시에 흐릴 수 있다"
      - option: "팀원의 불안을 줄이기 위해 합의되지 않은 기능도 일단 제품 범위에 포함한다"
        why_rejected: "단기 인정감은 줄 수 있지만, 팀 리듬과 병합 기준이 무너져 지속 가능한 실행이 어렵다"
      - option: "일정 운영 권한을 팀 전체 통제 권한처럼 둔다"
        why_rejected: "스크럼과 일정 관리는 WIP, 병목, 회복 리듬을 드러내는 장치여야 하며 팀 리듬을 흔드는 권한이 되어서는 안 된다"
    outcome: "pending"
    outcome_note: >
      다음 판단 기준은 중3/예비고1 학생·학부모가 자신의 기록과 상황을 바탕으로
      다음 1~3개의 행동을 더 선명하게 말할 수 있는가이다.
      5월 기획심의 전에는 랜딩페이지, Tally 인터뷰 신청 폼, 유효 인터뷰,
      페인포인트 검증표, 최소 입력 기반 AI 리포트 v0, 수행평가/탐구 플래너 v0,
      추천 근거와 체크리스트, 피드백 폼과 지불의향 질문에 집중한다.
      합격 가능성 점수화, 공식 생기부 문장 생성, 전면적인 멘토 매칭 마켓플레이스,
      거대한 모범 생기부 RAG, 전 학년·전 세그먼트 대응,
      고객검증 없이 만든 고급 기능은 후순위로 둔다.

  - id: "D038"
    date: "2026-05-08"
    decision: "휴포짓은 상위 창업 철학으로 재고정하고, 미리는 입시 vertical, 찐로는 취업 vertical로 둔다"
    rationale: >
      2026-05-03 전후 이미 별도 project-huposit 레이어에는 휴포짓 상위 철학,
      미리(MIRI) 입시 vertical, 찐로(Jjinro) 취업·커리어 vertical 방향이 정리되어 있었다.
      그러나 이후 약 5일 동안 팀원 의견을 충분히 존중하는 과정에서
      MIRI의 고객, 기능, BM, 구현 범위를 검증하는 수준을 넘어
      휴포짓이라는 창업 정체성 자체까지 다시 검증 대상으로 열어버렸다.
      이는 의견 수렴과 창업자 방향 선언의 경계가 흐려진 신호로 본다.
      따라서 휴포짓은 개인 데이터를 구조화해 AI가 읽고,
      마일스톤과 행동을 제안하며, 현실 실행과 피드백을 기록해 다음 추천을 개선하는
      상위 철학으로 다시 고정한다.
      Team 310은 소마 1년 동안 MIRI로 이 철학의 첫 사업화 가능성을 검증하는 프로젝트 팀이다.
    alternatives_rejected:
      - option: "팀원의 불안이나 반대 의견이 나올 때마다 휴포짓 상위 철학 자체를 다시 검증한다"
        why_rejected: "고객검증과 창업 정체성 검증이 섞이면 제품 범위와 팀 실행 리듬이 계속 흔들린다"
      - option: "휴포짓 철학을 숨기고 단기 입시 기능만으로 Team 310을 설명한다"
        why_rejected: "단기 실행은 쉬워질 수 있지만, 창업자의 장기 정체성과 MIRI의 차별화된 데이터 루프가 흐려진다"
      - option: "Team 310을 휴포짓 전체 회사를 함께하는 팀처럼 전제한다"
        why_rejected: "현재 팀의 합의 범위는 소마 1년 동안 MIRI를 검증하는 프로젝트 팀으로 보는 편이 더 정직하고 안정적이다"
    outcome: "pending"
    outcome_note: >
      앞으로 검증할 것은 MIRI의 고객 세그먼트, 페인포인트, 첫 output,
      가격, 기술 구현 범위, 기획심의 증거다.
      기본적으로 다시 열지 않을 것은 휴포짓을 상위 철학으로 둔다는 창업 정체성,
      미리=입시 vertical / 찐로=취업 vertical 구조,
      최종 방향과 범위는 CEO가 선언한다는 운영 원칙이다.

  - id: "D039"
    date: "2026-05-08"
    decision: "2026-05-08 당시 5월 기획심의 전략은 `휴포짓 큰 기획 + MIRI 1년 산출물`로 잡았고, 2026-05-10 이후 D042에서 재검증한다"
    rationale: >
      기획심의 통과 후 큰 주제를 바꾸기 어렵다는 제약이 있으므로,
      휴포짓이라는 상위 기술/철학을 숨기면 장기 확장성과 창업 정체성이 약해진다.
      반대로 MIRI와 Jjinro를 동시에 실행 범위로 열면
      팀 초점, 고객검증, 구현 범위가 다시 넓어져 5월 기획심의 메시지와 팀 지속 가능성을 해칠 수 있다.
      따라서 기획심의에서는 휴포짓 기반 개인 기록 의사결정 AI를 큰 기획으로 제시하되,
      소마 1년 동안의 실행 산출물은 입시·학생부 vertical MIRI 하나로 고정한다.
      Jjinro는 취업·커리어 후속 vertical 확장 가능성으로만 둔다.
    alternatives_rejected:
      - option: "기획심의 주제를 MIRI만으로 좁혀 휴포짓 상위 철학을 거의 드러내지 않는다"
        why_rejected: "기획심의 이후 큰 주제 변경이 어렵다면 장기 창업 정체성과 확장성을 잃을 수 있다"
      - option: "MIRI와 Jjinro를 소마 1년 실행 범위로 병렬 진행한다"
        why_rejected: "현재 팀 상태와 5월 기획심의 일정에서는 고객, 기능, 구현 범위가 과도하게 넓어질 위험이 크다"
      - option: "휴포짓 기술개발이라는 큰 말만 내세우고 MIRI 산출물을 약하게 둔다"
        why_rejected: "심사에서는 올해 실제 만들고 검증할 제품과 증거가 선명해야 한다"
    outcome: "pending"
    outcome_note: >
      2026-05-08 기준의 전략이었다. 2026-05-09 팀원 2명 하차와 2026-05-10 새 팀원 합류/휴포짓 데이터 루프 재정리 이후,
      D042에서 이 판단은 재검증 대상으로 바뀌었다.
      MIRI를 1년 산출물로 유지할 경우에는 중3 엄마 대상 랜딩페이지와 Tally 폼을 기반으로
      인터뷰와 샘플 output을 역산한다.
      `모두의 고민 -> 첫 vertical 선택`으로 조정할 경우에는 고민 구조화 리포트,
      태그 체계, 유사 고민 매칭 의향을 5월 evidence로 삼는다.

  - id: "D040"
    date: "2026-05-09"
    decision: "Team 310 핵심 팀원 2명 하차 이후 즉시 설득보다 수습, 인수인계, 멘토 공유, 범위 재산정을 우선한다"
    rationale: >
      2026-05-09 핵심 팀원 2명이 역량과 체력이 창업자의 속도와 몰입을 따라가기 어렵고,
      팀의 전진을 늦추고 있다는 미안함이 컸다는 취지로 하차 의사를 밝혔다.
      이 사건은 3인 체제 실행 가정이 종료됐다는 큰 상태 변화다.
      그러나 이를 즉시 방향 실패나 창업자 개인 실패로 단정하면,
      다음 48시간 안에 필요한 감사와 수습, 최소 인수인계, 프로젝트 자산 보존,
      담당멘토 공유, 멘토 지원 구조 재편, 5월 기획심의 범위 재산정을 놓칠 수 있다.
      따라서 우선 해석은 team capacity mismatch와 역할 밀도 불일치로 두고,
      실행 순서를 감정 수습과 현실 재설계 쪽으로 둔다.
    alternatives_rejected:
      - option: "즉시 설득하거나 하차 결정을 되돌리려 한다"
        why_rejected: "상대가 이미 역량·체력 한계를 이유로 정중히 하차 의사를 밝힌 상태에서는 설득이 관계와 인수인계를 더 어렵게 만들 수 있다"
      - option: "이탈을 곧바로 휴포짓/MIRI 방향 실패로 결론낸다"
        why_rejected: "팀 capacity와 제품 방향은 구분해서 봐야 하며, 고객검증과 기획심의 증거는 별도로 재산정할 수 있다"
      - option: "기존 3인 팀 기획심의 전략을 그대로 유지한다"
        why_rejected: "실행 주체가 바뀌었으므로 `완주 가능한 팀` 메시지와 구현 범위를 현실에 맞게 보정해야 한다"
    outcome: "pending"
    outcome_note: >
      다음 48시간의 우선순위는 감사와 수습 답장, repo/문서/계정/진행 중 작업 인수인계 확인,
      담당멘토 공유 이후 1명 하차/2명 유지 구조 반영, 5/28 기획심의 solo-feasible evidence 재산정이다.

  - id: "D041"
    date: "2026-05-09"
    decision: "2026-05-09 하차 직후 Team 310 멘토 지원 구조는 담당멘토 2인 유지 기준으로 수습했다"
    rationale: >
      팀원 2명 하차 상황을 담당멘토 3인에게 공유한 뒤,
      담당멘토 1명은 하차했고 2명은 계속 함께하기로 했다.
      이는 멘토 지원 구조가 3인 조합에서 2인 조합으로 축소됐다는 상태 변화다.
      그러나 남은 2명이 계속 함께하기로 했다는 점은
      Team 310이 즉시 완전히 고립된 것은 아니라는 중요한 완충 신호다.
      따라서 5월 기획심의와 5/18 피칭 연습은
      3인 멘토 조합을 전제로 하지 않고,
      남은 2인의 제품/BM/피칭 및 리더십/실행 리듬 지원을 중심으로 다시 설계한다.
    alternatives_rejected:
      - option: "담당멘토 1명 하차를 곧바로 프로젝트 종료 신호로 해석한다"
        why_rejected: "멘토 2명이 계속 함께하기로 했고, 고객검증과 최소 output 중심으로 범위를 줄이면 아직 기획심의 대응 여지가 있다"
      - option: "멘토 3인 체제였던 기존 계획을 그대로 유지한다"
        why_rejected: "AI workflow/레포 기반 작업 방식 보강 축이 약해졌으므로 지원 구조와 실행 범위를 현실에 맞게 바꿔야 한다"
      - option: "즉시 새 멘토 확보를 최우선으로 둔다"
        why_rejected: "2026-05-09 당시에는 새 멘토 탐색보다 남은 멘토 2인과 기획심의 최소 증거를 재산정하는 것이 더 긴급했다"
    outcome: "superseded_by_D045"
    outcome_note: >
      2026-05-09 하차 직후에는 2인 유지 기준으로 수습했으나,
      이후 AI/데이터 제품화 역량을 가진 신규 담당멘토 1명이 합류해
      현재 멘토 지원 구조는 D045의 3인 체계로 대체됐다.

  - id: "D042"
    date: "2026-05-10"
    decision: "Team 310 재구성 이후 휴포짓의 기술 경쟁력은 개인 데이터 구조화와 목적별 인사이트 루프로 설명한다"
    rationale: >
      팀원 2명과 담당멘토 1명 하차 이후에도 휴포짓 상위 철학 자체는 유지된다.
      다만 2026-05-10 후속 판단에서 5월 기획심의 evidence는
      특정 분야 산출물보다 `모두의 고민` 인터뷰를 통한 고객발굴로 조정했다.
      현재 더 선명해진 기술 축은 LLM 기능 자체가 아니라
      개인의 흩어진 기록, 고민, 목표, 제약을 목적별 데이터 구조로 바꾸고,
      그 구조에서 다음 행동, 반복 패턴, 유사 맥락, 피드백을 도출하는 능력이다.
      새 팀원도 단기 full-stack 구현 전력보다 데이터 구조화와 문제 모델링 보조 역할로 보는 편이 현실적이다.
    alternatives_rejected:
      - option: "특정 분야 기능 설명만으로 휴포짓 상위 기술 경쟁력을 대체한다"
        why_rejected: "휴포짓의 장기 방어력은 특정 분야 이름보다 개인 맥락 데이터 구조와 피드백 루프에 있다"
      - option: "새 팀원을 즉시 핵심 구현 공백을 메우는 full-stack 전력으로 본다"
        why_rejected: "현재 후보의 강점은 PS·수학·문제 모델링이며, 시간 제약과 개발 경험 부족을 고려하면 데이터 구조화/평가 지표 역할로 작게 시작해야 한다"
      - option: "새 팀원 관련 민감한 관계·경제 맥락을 public current state에 상세히 기록한다"
        why_rejected: "사람별 상세 맥락은 private people layer에 두고, public mirror에는 역할과 상태 변화만 익명화해 남기는 것이 맞다"
    outcome: "superseded_by_D044_for_5월_execution"
    outcome_note: >
      기술 경쟁력 가설은 유지하되, 5월 실행 전략은 D044에 따라
      모두의 고민 신청/인터뷰/구조화 리포트 기반 고객발굴로 낮춘다.

  - id: "D043"
    date: "2026-05-10"
    decision: "하차한 전 팀원의 별도 팀 구성은 감정적 해석보다 인수인계와 자산 경계 문제로 다룬다"
    rationale: >
      2026-05-09 핵심 팀원 2명 하차 이후, 2026-05-10 해당 전 팀원들이 별도 팀을 구성한 것으로 공유됐다.
      이 사실은 관계적으로 아프게 들어올 수 있지만,
      현재 프로젝트 판단에서는 비난이나 비교보다 문서, 계정, 산출물, 아이디어 경계를 정리하고
      새 팀원 온보딩과 기획심의 evidence에 집중하는 것이 더 중요하다.
      사람별 실명과 세부 관계 맥락은 private layer에 둔다.
    alternatives_rejected:
      - option: "이 사건을 즉시 공개적 비난이나 관계 단절로 다룬다"
        why_rejected: "감정은 유효하지만 5월 기획심의 직전에는 자산 경계와 실행 초점 회복이 더 직접적인 병목이다"
      - option: "아무 일도 아닌 것처럼 넘긴다"
        why_rejected: "하차 직후 별도 팀 구성은 인수인계, 계정 접근권한, 문서와 아이디어 경계를 점검해야 하는 신호다"
    outcome: "active"

  - id: "D044"
    date: "2026-05-10"
    decision: "5월 마일스톤은 특정 분야 산출물이 아니라 모두의 고민 기반 고객발굴 evidence로 낮춘다"
    rationale: >
      팀원 2명 및 담당멘토 1명 하차 이후 5월 기획심의까지 남은 시간과 팀 실행력을 고려하면,
      특정 분야 이름이나 기능 묶음을 앞세우는 전략은 다시 무거워진다.
      현재 더 설득력 있는 방식은 휴포짓의 개인 데이터 구조화 철학을 유지하되,
      모두의 고민 신청, 10명 인터뷰, 구조화 리포트 샘플, 반복 고민군 후보,
      고민 태그/평가 지표 초안으로 수수하게 고객발굴 evidence를 만드는 것이다.
    alternatives_rejected:
      - option: "5월에도 특정 분야 산출물을 1년 결과물로 고정한다"
        why_rejected: "현재 팀 재구성 상황과 도메인 확신 격차를 고려하면 팀원 설득과 실행 범위가 다시 무거워진다"
      - option: "휴포짓을 너무 큰 철학으로만 설명한다"
        why_rejected: "심사와 팀 실행 모두에서 실제 고객발굴, 인터뷰 수, 구조화 샘플 같은 작은 증거가 필요하다"
    outcome: "active"

  - id: "D045"
    date: "2026-05-10"
    decision: "Team 310 멘토 지원 구조는 담당멘토 3인 체계로 복구하고, AI/데이터 제품화 축을 새로 분리해 활용한다"
    rationale: >
      팀원 2명 하차 이후 담당멘토 1명이 하차하면서 멘토 지원 구조가 일시적으로 2인으로 축소됐지만,
      2026-05-10 AI/데이터 제품화와 엔지니어링 리더십 경험을 가진 신규 담당멘토 1명이 합류했다.
      따라서 현재 판단은 2인 수습 구조가 아니라,
      제품/BM/보안, 서비스화/실행 리듬, AI/데이터 제품화 질문을
      담당멘토 3인에게 분리해 가져가는 구조다.
      타인의 실명과 상세 이력은 private people layer에 둔다.
    alternatives_rejected:
      - option: "멘토 2인 축소 상태로 계속 읽는다"
        why_rejected: "신규 담당멘토 합류로 지원 구조가 실제로 바뀌었으므로 현재 상태를 반영해야 한다"
      - option: "신규 멘토 합류를 이유로 5월 구현 범위를 다시 키운다"
        why_rejected: "멘토 보강은 판단의 질을 높이는 신호이지 팀의 즉시 구현 capacity가 늘어난 것은 아니다"
    outcome: "active"
