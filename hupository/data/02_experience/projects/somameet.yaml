program:
  name: "SW마에스트로 AI 기술교육"
  cohort_context: "2026년 SW마에스트로 17기 AI 기술교육 31조"
  note: "공개 기록에서는 팀원 실명과 연락처를 제외하고 프로젝트·역할·기술 학습 중심으로 보존한다."

summary: >
  SomaMeet은 개인 일정의 제목, 장소, 설명을 공유하지 않고도 여러 사람의 공통 가능 시간을 찾는
  개인정보 보호 일정 조율 Agentic Workflow 프로젝트다. SW마에스트로 안에서 반복되는 팀 회의,
  멘토링, 코칭 일정 조율 문제를 대상으로 삼았고, 가능한 시간 입력, busy/free 정규화,
  deterministic scheduling engine, 후보 시간 추천, 공유 메시지 초안 생성을 하나의 데모 흐름으로 구현했다.

role: "팀원 / 문제정의·기획 통합 / 개인 데모 구현 / 발표 준비 서포트"
team:
  size: 5
  public_description: "SW마에스트로 AI 기술교육 31조 팀 프로젝트"

problem_definition:
  - "여러 사람이 참여하는 회의 일정을 잡을 때 개인 일정 세부 정보를 공개하지 않으면서 공통 가능 시간을 찾기 어렵다."
  - "메신저 기반 일정 조율은 응답이 흩어지고 정리 시간이 오래 걸린다."
  - "일반 공유캘린더는 일정 제목, 장소, 세부 내용 노출 부담이 있다."
  - "사용자마다 Google Calendar, Apple Calendar, Outlook, 네이버 캘린더, 수기 일정표 등 서로 다른 도구를 사용한다."

product_principles:
  - "원본 캘린더를 복제하지 않는다."
  - "일정 제목, 장소, 설명을 저장하지 않는다."
  - "회의 조율에 필요한 busy/free availability block만 사용한다."
  - "시간 후보 계산은 deterministic scheduling engine이 맡고, LLM은 추천 이유와 메시지 초안을 보조한다."
  - "사용자 승인 없는 자동 일정 확정이나 자동 메시지 발송은 하지 않는다."

key_features:
  - "회의 생성"
  - "참여자 닉네임 등록"
  - "직접 busy/free 입력"
  - ".ics 업로드와 privacy-safe 파싱"
  - "30분 단위 타임테이블"
  - "공통 후보 시간 계산"
  - "후보 3개 추천"
  - "오프라인 회의 30분 버퍼"
  - "후보 없음 fallback 또는 조건 완화 제안"
  - "확정 메시지 초안 생성"
  - "회의 링크와 QR 기반 공유 UI"

tech_stack:
  frontend:
    - React
    - TypeScript
    - Vite
    - Tailwind CSS
    - React Router
    - react-hook-form
    - zod
    - Playwright
  backend:
    - Python 3.11+
    - FastAPI
    - SQLAlchemy
    - Alembic
    - Pydantic
    - icalendar
    - OpenAI-compatible LLM client
  ai_workflow:
    - "Prompt Engineering"
    - "Agent Workflow"
    - "privacy-safe LLM payload"
    - "template fallback"
    - "Upstage/Solar-compatible adapter"
  infra:
    - Docker
    - Docker Compose
    - Vercel

learning_outcomes:
  - "기획서 제출, 데모 코드 제출, 최종 발표까지 이어지는 짧은 AI 교육 프로젝트의 전체 사이클을 경험했다."
  - "LLM이 시간을 직접 지어내지 않도록 deterministic scheduling engine을 guardrail로 두는 설계를 배웠다."
  - "개인정보 보호를 기능 문구가 아니라 DB 컬럼, ICS parser, LLM payload 제한, 만료 삭제 정책으로 구현하는 관점을 얻었다."
  - "여러 개인 구현물을 모두 병합하기보다 하나의 안정적인 기준 구현을 선택하고 필요한 아이디어만 흡수하는 통합 전략을 배웠다."
  - "FastAPI 기반 API, React 기반 UI, LLM adapter, 테스트, 배포 설정이 연결된 Agentic Workflow 데모 구조를 읽고 비교했다."

